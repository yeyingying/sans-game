name: Test and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sansgecao-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Verify deploy mirrors source
        run: node scripts/check-deploy-sync.mjs
      - name: Frontend regression
        run: |
          node test/headless.mjs
          node test/headless.mjs boss
          node test/headless.mjs clear
          node test/weapons_smoke.mjs
          node test/leaderboard.mjs
      - name: Backend deterministic tests
        run: node server/test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ github.sha }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_REGION: cn-hongkong
      OSS_ENDPOINT: https://oss-cn-hongkong.aliyuncs.com
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$OSS_ACCESS_KEY_ID"
          test -n "$OSS_ACCESS_KEY_SECRET"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
      - name: Build one release artifact
        run: |
          node scripts/check-deploy-sync.mjs
          node scripts/write-deploy-manifest.mjs
          tar -czf "$RUNNER_TEMP/sansgecao-release.tgz" deploy server/app.mjs server/admin.mjs server/core.mjs server/geo.mjs server/package.json server/package-lock.json server/DEPLOY_SHA
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Stage and validate server release
        run: |
          scp -i ~/.ssh/deploy_key "$RUNNER_TEMP/sansgecao-release.tgz" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/sansgecao-$DEPLOY_SHA.tgz"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; release=/opt/sansgecao-releases/$DEPLOY_SHA; rm -rf \"\$release\"; mkdir -p \"\$release\"; tar -xzf /tmp/sansgecao-$DEPLOY_SHA.tgz -C \"\$release\"; node --check \"\$release/server/app.mjs\"; node --check \"\$release/server/admin.mjs\"; cd \"\$release/server\"; npm ci --omit=dev"
      - name: Install verified ossutil
        run: |
          curl -fsSLo "$RUNNER_TEMP/ossutil.zip" https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          printf '%s  %s\n' '3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a' "$RUNNER_TEMP/ossutil.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP/ossutil"
          sudo install -m 755 "$RUNNER_TEMP/ossutil/ossutil-2.3.0-linux-amd64/ossutil" /usr/local/bin/ossutil
      - name: Sync exact release to OSS
        run: ossutil sync deploy/ oss://sanssurvivor/ -f --disable-ignore-error
      - name: Activate Caddy and API release
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; release=/opt/sansgecao-releases/$DEPLOY_SHA; rsync -a --delete \"\$release/deploy/\" /opt/sans-game-web/deploy/; rsync -a \"\$release/server/\" /opt/sansgecao-api/; systemctl restart sansgecao-api; systemctl is-active --quiet sansgecao-api; rm -f /tmp/sansgecao-$DEPLOY_SHA.tgz"
      - name: Verify OSS, Caddy and API expose one commit
        run: node scripts/verify-public.mjs
