<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0c0a10" />
  <title>我做了一个Sans割草游戏.</title>
  <link rel="icon" href="icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css?v=s2-20260726-a11y1" />
</head>
<body>
  <div id="wrap">
    <canvas
      id="game"
      width="960"
      height="600"
      tabindex="0"
      role="application"
      aria-label="Sans 割草游戏"
      aria-describedby="game-instructions"
      aria-keyshortcuts="Enter Space ArrowUp ArrowDown ArrowLeft ArrowRight Escape"
    ></canvas>
  </div>
  <p id="game-instructions" class="sr-only">按 Enter 打开模式选择，方向键移动，Enter 确认，Esc 返回。空格可直接进入经典模式。</p>
  <div id="game-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="rotate-hint">📱 请横屏以获得最佳体验</div>
  <script type="module" src="src/main.js?v=s2-20260726-td8"></script>
</body>
</html>
